.wrap { zoom: var(--zoom); }
* { box-sizing: border-box; }
body {

.card {

select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 8px 10px; }

.appear .sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); width: 100%; max-width: 620px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.appear h2 { font: 800 22px/1.2 var(--f-display); margin: 0; }

.optrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

.field { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md); padding: 8px 10px; min-width: 0; flex: 1; }
.editor:empty { display: none; }

.gitem:first-child { border-top: 0; }
.gitem dt { font: 800 17px/1.3 var(--f-display); }

.gitem ul { margin: 0; padding-left: 18px; }
@media (max-width: 560px) { .gitem { grid-template-columns: 1fr; gap: 4px; } }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

        swatch(p), h("b", {}, p.name),
        p.custom ? h("span", { class: "pacts" },
          h("button", { type: "button", class: "linkbtn", onclick: () => openEditor(p) }, "edit"),
          h("button", { type: "button", class: "linkbtn", onclick: () => shareTheme(p) }, "share"),
          h("button", { type: "button", class: "linkbtn", onclick: () => { theme.custom = theme.custom.filter((c) => c.id !== p.id); if (theme.preset === p.id) theme.preset = null; saveTheme(); } }, "delete")) : null))),
    h("div", { class: "row" },
      h("button", { class: "btn primary", type: "button", onclick: () => openEditor(null) }, "+ Create custom theme"),
      h("button", { class: "btn", type: "button", onclick: openImport }, "Import theme code")),
    h("div", { class: "editor", id: "theme-editor" }),
  );
}
async function shareTheme(c) {
  const code = themeCode(c), ed = $("#theme-editor");
  const field = h("input", { class: "field", id: "share-code", value: code, readonly: true });
  ed.replaceChildren(h("p", { class: "note" }, "Theme code for “" + c.name + "”. Send it to a friend; it also works in the AXON app."), field);
  try { await navigator.clipboard.writeText(code); ed.firstChild.textContent = "Copied! Send this code to a friend; it also works in the AXON app."; }
  catch { field.focus(); field.select(); }
}
function openImport() {
  const ed = $("#theme-editor");
  const input = h("input", { class: "field", id: "import-code", placeholder: "AXON-THEME:…" });
  const msg = h("p", { class: "note" }, "Paste a theme code someone shared with you (from this page or the AXON app):");
  ed.replaceChildren(msg, h("div", { class: "row" }, input, h("button", { class: "btn primary", type: "button", onclick: () => {
    try {
      const d = JSON.parse(decodeURIComponent(escape(atob(input.value.trim().replace(/^AXON-THEME:/, "")))));
      const colors = {};
      for (const [k] of KEYS) if (/^#[0-9a-f]{6}$/i.test(d.colors?.[k])) colors[k] = d.colors[k];
      if (Object.keys(colors).length < 5) throw 0;
      const nt = { id: "c" + Date.now().toString(36), name: String(d.name || "Shared theme").slice(0, 40), base: d.base === "light" ? "light" : "dark", colors, custom: true };
      theme.custom.push(nt); theme.preset = nt.id; saveTheme();
    } catch { msg.textContent = "That code isn't a valid AXON theme. Check you copied all of it."; }
  } }, "Add theme")));
  input.focus();
}
function openEditor(existing) {
  const cur = resolveTheme(theme) || { base: matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light", colors: matchMedia("(prefers-color-scheme: dark)").matches ? STUDY_DARK : STUDY_LIGHT };
  const draft = existing ? { id: existing.id, name: existing.name, base: existing.base, colors: { ...existing.colors } } : { id: null, name: "My theme", base: cur.base, colors: { ...cur.colors } };
  const ed = $("#theme-editor");
  const preview = () => applyTheme(theme, { base: draft.base, colors: draft.colors });
  const name = h("input", { class: "field", id: "theme-name", value: draft.name, maxlength: "40", "aria-label": "Theme name" });
  const baseSeg = h("div", { class: "seg" }, ["dark", "light"].map((b) => h("button", { type: "button", "aria-pressed": String(draft.base === b),
    onclick: (e) => { draft.base = b; for (const x of baseSeg.children) x.setAttribute("aria-pressed", String(x === e.currentTarget)); preview(); } }, b === "dark" ? "Dark base" : "Light base")));
  ed.replaceChildren(
    h("h3", {}, existing ? "Edit theme" : "New custom theme"),
    h("div", { class: "optrow" }, name, baseSeg),
    h("div", { class: "colors" }, KEYS.map(([k, n]) => h("label", {}, h("input", { type: "color", value: draft.colors[k], oninput: (e) => { draft.colors[k] = e.target.value; preview(); } }), n))),
    h("p", { class: "note" }, "Changes preview live across the whole page."),
    h("div", { class: "row" },
      h("button", { class: "btn", type: "button", onclick: () => { applyTheme(theme); ed.replaceChildren(); } }, "Cancel"),
      h("button", { class: "btn primary", type: "button", onclick: () => {
        draft.name = name.value.trim() || "My theme";
        if (draft.id) Object.assign(theme.custom.find((c) => c.id === draft.id), draft);
        else { draft.id = "c" + Date.now().toString(36); theme.custom.push({ ...draft, custom: true }); }
        theme.preset = draft.id; saveTheme();
      } }, "Save theme")),
  );
  preview();
  ed.scrollIntoView({ block: "nearest" });
}
applyTheme(theme);

/* ---------- views ---------- */
let view = "cards";
function show(name) {
  if (!["cards", "quiz", "terms"].includes(name)) name = "cards";
  view = name;
  for (const t of document.querySelectorAll(".tab")) t.setAttribute("aria-selected", String(t.dataset.view === name));
  for (const n of ["cards", "quiz", "terms"]) $("#view-" + n).hidden = n !== name;
  store.set("view", name);
}
for (const t of document.querySelectorAll(".tab")) t.addEventListener("click", () => show(t.dataset.view));
renderUnits(); resetCards(); renderQuizSetup(); renderTerms();
show(location.hash.slice(1) || store.get("view", "cards"));
</script>
